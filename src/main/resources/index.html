<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traductor Español ↔ Inglés</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f0f4f8;
      --surface: #ffffff;
      --text: #2c3e50;
      --muted: #687786;
      --border: #c7d0d9;
      --result: #e8f5e9;
      --accent: #3498db;
      --accent-hover: #2980b9;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #17212b;
      --surface: #24313d;
      --text: #edf2f7;
      --muted: #b0bec9;
      --border: #526170;
      --result: #263d35;
      --accent: #2786c2;
      --accent-hover: #1d6fa5;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: var(--page);
      color: var(--text);
      transition: background-color 0.2s, color 0.2s;
    }
    .toolbar { display: flex; justify-content: flex-end; gap: 10px; }
    h1 { text-align: center; color: var(--text); }
    textarea {
      width: 100%;
      height: 90px;
      padding: 10px;
      font-size: 16px;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      resize: vertical;
    }
    select, input[type="file"] {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
    }
    .file-panel {
      margin-top: 28px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    #downloadResult { display: block; margin-top: 12px; text-align: center; }
    #downloadResult[hidden] { display: none; }
    button {
      padding: 10px 16px;
      font-size: 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible, textarea:focus-visible { outline: 3px solid #f1c40f; outline-offset: 2px; }
    .translate-button { display: block; margin: 20px auto; padding: 12px 40px; font-size: 18px; }
    label { font-weight: bold; display: block; margin-top: 15px; color: var(--text); }
    #resultado { background: var(--result); }
    #estado { text-align: center; color: var(--muted); font-style: italic; }
    @media (max-width: 480px) {
      body { margin: 16px auto; padding: 16px; }
      .toolbar { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="toolbar">
  <button id="languageToggle" type="button" aria-label="Cambiar idioma">English</button>
  <button id="themeToggle" type="button" aria-label="Activar modo noche">🌙 Modo noche</button>
</div>
<h1 id="title">🌐 Traductor Español ↔ Inglés</h1>
<label id="directionLabel" for="direction">Dirección:</label>
<select id="direction">
  <option value="es-en">Español → Inglés</option>
  <option value="en-es">English → Spanish</option>
</select>
<label id="inputLabel" for="entrada">Texto en Español:</label>
<textarea id="entrada" placeholder="Ej: hola"></textarea>
<button id="translateButton" class="translate-button" type="button">Traducir</button>
<label id="resultLabel" for="resultado">Traducción:</label>
<textarea id="resultado" readonly></textarea>
<p id="estado" aria-live="polite"></p>
<section class="file-panel" aria-labelledby="fileTitle">
  <h2 id="fileTitle">Traducir archivo</h2>
    <label id="fileLabel" for="archivo">Subir archivo .txt, .docx o .pdf:</label>
    <input id="archivo" type="file" accept=".txt,.docx,.pdf,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
    <button id="fileButton" class="translate-button" type="button">Traducir y descargar</button>
    <a id="downloadResult" hidden></a>
</section>
<script>
  const translations = {
    es: {
      title: '🌐 Traductor Español ↔ Inglés',
      directionLabel: 'Dirección:',
      inputLabelSpanish: 'Texto en Español:',
      inputPlaceholderSpanish: 'Ej: hola',
      inputLabelEnglish: 'Text in English:',
      inputPlaceholderEnglish: 'Ej: hello',
      translate: 'Traducir',
      resultLabel: 'Traducción:',
      empty: '⚠️ Escribe algo',
      loading: '⏳ Traduciendo...',
      success: '✅ Listo · validado por reglas',
      fileTitle: 'Traducir archivo',
      fileLabel: 'Subir archivo .txt, .docx o .pdf:',
      fileButton: 'Traducir y descargar',
      fileEmpty: '⚠️ Selecciona un archivo .txt, .docx o .pdf',
      fileLoading: '⏳ Traduciendo archivo...',
      fileSuccess: '✅ Traducción lista en el mismo formato.',
      fileError: '❌ No se pudo traducir el archivo',
      download: 'Descargar traducción',
      fileTooLarge: '⚠️ El archivo supera el límite de 10 MB',
      error: '❌ Error',
      languageButton: 'English',
      languageLabel: 'Cambiar idioma',
      night: '🌙 Modo noche',
      day: '☀️ Modo día',
      activateNight: 'Activar modo noche',
      activateDay: 'Activar modo día'
    },
    en: {
      title: '🌐 Spanish ↔ English Translator',
      directionLabel: 'Direction:',
      inputLabelSpanish: 'Text in Spanish:',
      inputPlaceholderSpanish: 'E.g.: hola',
      inputLabelEnglish: 'Text in English:',
      inputPlaceholderEnglish: 'E.g.: hello',
      translate: 'Translate',
      resultLabel: 'Translation:',
      empty: '⚠️ Please enter some text',
      loading: '⏳ Translating...',
      success: '✅ Done · rules validated',
      fileTitle: 'Translate a file',
      fileLabel: 'Upload a .txt, .docx, or .pdf file:',
      fileButton: 'Translate and download',
      fileEmpty: '⚠️ Select a .txt, .docx, or .pdf file',
      fileLoading: '⏳ Translating file...',
      fileSuccess: '✅ Translation ready in the same format.',
      fileError: '❌ Could not translate the file',
      download: 'Download translation',
      fileTooLarge: '⚠️ File exceeds the 10 MB limit',
      error: '❌ Error',
      languageButton: 'Español',
      languageLabel: 'Change language',
      night: '🌙 Dark mode',
      day: '☀️ Light mode',
      activateNight: 'Activate dark mode',
      activateDay: 'Activate light mode'
    }
  };

  const languageToggle = document.getElementById('languageToggle');
  const themeToggle = document.getElementById('themeToggle');
  const entrada = document.getElementById('entrada');
  const resultado = document.getElementById('resultado');
  const estado = document.getElementById('estado');
  const direction = document.getElementById('direction');
  const archivo = document.getElementById('archivo');
  const downloadResult = document.getElementById('downloadResult');
  let downloadUrl = '';
  let language = localStorage.getItem('translator-language') === 'en' ? 'en' : 'es';

  function applyLanguage() {
    const text = translations[language];
    document.documentElement.lang = language;
    document.title = text.title.replace('🌐 ', '');
    document.getElementById('title').textContent = text.title;
    document.getElementById('directionLabel').textContent = text.directionLabel;
    actualizarEntrada();
    document.getElementById('translateButton').textContent = text.translate;
    document.getElementById('resultLabel').textContent = text.resultLabel;
    document.getElementById('fileTitle').textContent = text.fileTitle;
    document.getElementById('fileLabel').textContent = text.fileLabel;
    document.getElementById('fileButton').textContent = text.fileButton;
    downloadResult.textContent = text.download;
    languageToggle.textContent = text.languageButton;
    languageToggle.setAttribute('aria-label', text.languageLabel);
    updateThemeButton();
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    localStorage.setItem('translator-theme', theme);
    updateThemeButton();
  }

  function actualizarEntrada() {
    const text = translations[language];
    const ingles = direction.value === 'en-es';
    document.getElementById('inputLabel').textContent =
      ingles ? text.inputLabelEnglish : text.inputLabelSpanish;
    entrada.placeholder = ingles ? text.inputPlaceholderEnglish : text.inputPlaceholderSpanish;
  }

  function updateThemeButton() {
    const dark = document.documentElement.dataset.theme === 'dark';
    const text = translations[language];
    themeToggle.textContent = dark ? text.day : text.night;
    themeToggle.setAttribute('aria-label', dark ? text.activateDay : text.activateNight);
  }

  function traducir() {
    const text = translations[language];
    const texto = entrada.value;
    if (!texto.trim()) {
      resultado.value = '';
      estado.textContent = text.empty;
      return;
    }

    resultado.value = '';
    estado.textContent = text.loading;
    fetch('/traducir?texto=' + encodeURIComponent(texto) +
      '&direccion=' + encodeURIComponent(direction.value), {
      headers: { 'Accept': 'application/json' }
    })
      .then(response => response.json())
      .then(data => {
        resultado.value = data.traduccion || '';
        estado.textContent = data.error ? `❌ ${data.error}` : text.success;
      })
      .catch(() => {
        resultado.value = '';
        estado.textContent = text.error;
      });
  }

  function traducirArchivo() {
    const text = translations[language];
    const file = archivo.files[0];
    const extension = file ? file.name.split('.').pop().toLowerCase() : '';
    if (!file || !['txt', 'docx', 'pdf'].includes(extension)) {
      estado.textContent = text.fileEmpty;
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      estado.textContent = text.fileTooLarge;
      return;
    }

    resultado.value = '';
    downloadResult.hidden = true;
    estado.textContent = text.fileLoading;
    file.arrayBuffer()
      .then(contenido => fetch('/traducir-archivo?direccion=' +
        encodeURIComponent(direction.value) + '&nombre=' + encodeURIComponent(file.name), {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: contenido
        }))
      .then(response => response.json().then(data => ({ response, data })))
      .then(({ response, data }) => {
        if (!response.ok || data.error || data.detail) {
          throw new Error(data.error || data.detail || text.fileError);
        }
        const bytes = Uint8Array.from(atob(data.contenido), caracter => caracter.charCodeAt(0));
        if (extension === 'txt') {
          resultado.value = new TextDecoder('utf-8').decode(bytes);
        }
        if (downloadUrl) URL.revokeObjectURL(downloadUrl);
        downloadUrl = URL.createObjectURL(new Blob(
          [bytes], { type: data.tipo_mime }
        ));
        downloadResult.href = downloadUrl;
        downloadResult.download = data.nombre;
        downloadResult.hidden = false;
        estado.textContent = text.fileSuccess;
      })
      .catch(error => {
        resultado.value = '';
        estado.textContent = `${text.fileError}: ${error.message}`;
      });
  }

  languageToggle.addEventListener('click', () => {
    language = language === 'es' ? 'en' : 'es';
    localStorage.setItem('translator-language', language);
    applyLanguage();
  });
  direction.addEventListener('change', actualizarEntrada);
  themeToggle.addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
  document.getElementById('translateButton').addEventListener('click', traducir);
  document.getElementById('fileButton').addEventListener('click', traducirArchivo);
  entrada.addEventListener('keydown', event => {
    if (event.ctrlKey && event.key === 'Enter') traducir();
  });

  const savedTheme = localStorage.getItem('translator-theme');
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  applyLanguage();
</script>
</body>
</html>
